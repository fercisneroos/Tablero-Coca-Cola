<!DOCTYPE html>
<html lang="es">
<head>

<style>
@keyframes bg {
  0% {background-position:0% 50%}
  50% {background-position:100% 50%}
  100% {background-position:0% 50%}
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:linear-gradient(270deg,#B11217,#E41F26,#FF6A00,#E41F26,#B11217);
  background-size:1000% 1000%;
  animation:bg 30s ease infinite;
}

header{
  position:fixed;
  top:0; left:0; right:0;
  height:70px;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  letter-spacing:1px;
  z-index:1000;
}

main{padding-top:80px}

.login{
  height:calc(100vh - 80px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  background:rgba(0,0,0,.85);
  padding:3rem;
  border-radius:16px;
  width:330px;
  text-align:center;
}

.login-box input{
  width:100%;
  padding:.8rem;
  border-radius:10px;
  border:none;
  margin:1rem 0;
  text-align:center;
}

.login-box button{
  width:100%;
  padding:.8rem;
  background:#E41F26;
  border:none;
  border-radius:10px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.error{color:#ffb3b3;font-size:.9rem}

.opciones{
  height:calc(100vh - 80px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:3rem;
}

.opcion{
  width:260px;
  height:200px;
  background:rgba(0,0,0,.85);
  border-radius:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.8rem;
  font-weight:bold;
  cursor:pointer;
}

h1{text-align:center;margin:1rem 0}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:1.8rem;
  padding:2rem;
  max-width:1300px;
  margin:auto;
}

.card-btn{
  background:rgba(0,0,0,.85);
  border-radius:16px;
  min-height:140px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:1.2rem;
  font-weight:bold;
  color:white;
  border:3px solid white;
  text-decoration:none;
  transition:.3s;
}

.card-btn:hover{
  transform:translateY(-6px) scale(1.05);
}

.back-btn{
  display:inline-block;
  margin:1rem auto;
  padding:.6rem 1.4rem;
  background:#000;
  border:2px solid white;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}
.back-btn:hover{background:#222}
.center{text-align:center}
</style>
